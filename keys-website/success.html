<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Амжилттай - Google AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #0f1115; color: white; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-[#181b21] border border-gray-800 rounded-3xl p-8 max-w-lg w-full text-center">
        <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        
        <h2 class="text-3xl font-bold mb-2">Төлбөр амжилттай!</h2>
        <p class="text-gray-400 mb-8">Google AI Pro 18 сарын эрх худалдан авсанд баярлалаа.</p>

        <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 mb-8 text-left">
            <p class="text-sm font-bold text-blue-400 mb-3">Идэвхжүүлэх заавар:</p>
            <ol class="list-decimal list-inside text-sm text-gray-300 space-y-2 mb-6">
                <li>Доорх линк рүү орно.</li>
                <li>Өөрийн Google (Gmail) хаягаар нэвтрэнэ.</li>
                <li>Эрхээ баталгаажуулаад шууд ашиглаж эхлэх боломжтой.</li>
            </ol>
            
            <a id="activationLinkBtn" href="#" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition break-all px-4 text-sm">
                ЛИНК ОЛДСОНГҮЙ
            </a>
        </div>
        <a href="/" class="text-gray-500 hover:text-white underline text-sm">Нүүр хуудас руу буцах</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const assignedLink = urlParams.get('link');
            const btn = document.getElementById('activationLinkBtn');
            
            if (assignedLink) {
                btn.href = assignedLink;
                btn.innerText = "ЭНД ДАРЖ ИДЭВХЖҮҮЛНЭ ҮҮ";
            }
        });
    </script>
</body>
</html>
